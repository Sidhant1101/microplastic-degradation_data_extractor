# Microplastic Degradation Research Data Extractor AI
#
#   cp .env.example .env      # then edit passwords / model
#   docker compose up -d
#   open http://localhost:${FRONTEND_PORT:-3000}
#
# Only the frontend is published. PostgreSQL, Ollama and the backend API are reachable
# only on the private Docker network (the frontend proxies /api/* to the backend).
# GPU:        docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: microplastic-degradation-ai

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mpai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mpai}
  DATA_DIR: /data
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
  OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
  OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  CHUNK_SIZE: ${CHUNK_SIZE:-6000}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-600}
  MAX_CHUNKS: ${MAX_CHUNKS:-24}
  MAX_EXPERIMENTS_PER_PAPER: ${MAX_EXPERIMENTS_PER_PAPER:-30}
  VALIDATION_LLM_ENABLED: ${VALIDATION_LLM_ENABLED:-true}
  EXTRACTION_TIMEOUT_SECONDS: ${EXTRACTION_TIMEOUT_SECONDS:-3600}
  OCR_ENABLED: ${OCR_ENABLED:-true}
  OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
  TABLE_EXTRACTOR: ${TABLE_EXTRACTOR:-auto}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  METADATA_LOOKUP_ENABLED: ${METADATA_LOOKUP_ENABLED:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-30}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mpai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [appnet]
    logging: *logging

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [appnet]
    logging: *logging

  # One-shot helper: downloads OLLAMA_MODEL on first start (quick no-op when already present).
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-llama3.1}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [appnet]
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: microplastic-degradation-ai/backend:latest
    restart: unless-stopped
    command: ["api"]
    environment:
      <<: *backend-env
      EMBEDDED_WORKER: "false"
      API_WORKERS: ${API_WORKERS:-2}
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks: [appnet]
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: microplastic-degradation-ai/backend:latest
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *backend-env
    volumes:
      - appdata:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [appnet]
    logging: *logging

  frontend:
    build:
      context: ./frontend
    image: microplastic-degradation-ai/frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [appnet]
    logging: *logging

volumes:
  pgdata:
  ollama_models:
  appdata:

networks:
  # Private bridge network. Only the frontend publishes a port; PostgreSQL, Ollama and the
  # backend are reachable from other containers only. (Ollama keeps outbound internet access
  # so it can download models.)
  appnet: {}
